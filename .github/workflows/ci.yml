name: Windows build and non-native tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Run resolver and installer checks without native FASTMEAN
        run: python -m unittest discover -s tests -v
      - name: Build the licensed release installer and source bundle
        run: python build.py --output dist --version 1.0.1
      - uses: actions/upload-artifact@v6
        with:
          name: FASTMEAN-RussianUI-Setup
          path: dist/*
          if-no-files-found: error
